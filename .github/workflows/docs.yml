# Builds docs/index.md into an encrypted page and deploys it to Cloudflare Pages on every push to main.
# Secrets required (repo Settings > Secrets and variables > Actions):
#   STATICRYPT_PASSWORD    passphrase visitors type to unlock the page (16+ characters)
#   CLOUDFLARE_API_TOKEN   API token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard sidebar
name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/site --project-name=vla-test
